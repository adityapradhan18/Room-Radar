# ============================================================================
# Room Radar - Application Configuration (PostgreSQL)
# ============================================================================
spring.application.name=room-radar-backend
server.port=8080

# PostgreSQL Database Connection
# Defaults to localhost:5432/roomradar with user/password postgres/postgres
# Override using environment variables DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomradar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JSON & Date Formatting
spring.jackson.time-zone=UTC

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.roomradar=INFO
