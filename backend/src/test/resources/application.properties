# ============================================================================
# Room Radar - Test Configuration (In-Memory H2 with PostgreSQL Emulation)
# ============================================================================
spring.application.name=room-radar-test

spring.datasource.url=jdbc:h2:mem:roomradartest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.com.roomradar=INFO
