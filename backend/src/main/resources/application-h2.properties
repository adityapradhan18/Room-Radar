# ============================================================================
# Room Radar - H2 Profile (Zero-Prerequisite Standalone Demo Mode)
# Activated via: mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
# ============================================================================
spring.application.name=room-radar-demo-h2
server.port=8080

spring.datasource.url=jdbc:h2:mem:roomradardemo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Enable H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.roomradar=INFO
